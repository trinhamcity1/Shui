name: Histudy
options:
  bundleIdPrefix: com.histudy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  Histudy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Histudy/App
      - path: Histudy/Sources
      - path: Histudy/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.histudy.app
        PRODUCT_NAME: Histudy
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Histudy/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  HistudyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HistudyTests
    dependencies:
      - target: Histudy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.histudy.tests
        SWIFT_VERSION: "5.0"

schemes:
  Histudy:
    build:
      targets:
        Histudy: all
        HistudyTests: [test]
    test:
      config: Debug
      targets:
        - HistudyTests
    run:
      config: Debug
