name: Shui
options:
  bundleIdPrefix: com.shui
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    minVersion: 11.0.0

targets:
  Shui:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shui/App
      - path: Shui/Sources
      - path: Shui/Resources
    dependencies:
      # No FirebaseStorage — video lives in Cloudflare R2.
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseAnalytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shui.app
        PRODUCT_NAME: Shui
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Shui/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  ShuiTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShuiTests
    dependencies:
      - target: Shui
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shui.tests
        SWIFT_VERSION: "5.0"

schemes:
  Shui:
    build:
      targets:
        Shui: all
        ShuiTests: [test]
    test:
      config: Debug
      targets:
        - ShuiTests
    run:
      config: Debug
